<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>ApplyPilot · 测试网申</title><style>body{font:16px sans-serif;max-width:620px;margin:40px auto}label{display:block;margin:20px 0}input,select,textarea{display:block;padding:8px;width:90%}</style><h1>测试网申 · 不会真实投递</h1><form id="application"><label>姓名<input name="fullName" required></label><label>Email<input type="email" name="email" required></label><label>手机号<input name="phone"></label><label>毕业院校<input name="school" value="已有学校"></label><label>学历<select name="degree"><option value="">请选择</option><option value="bachelor">本科</option><option value="master">硕士</option></select></label><label>自我介绍<textarea name="intro"></textarea></label><label>上传简历<input name="resume" type="file" accept=".pdf"></label><label><input type="checkbox" name="consent">我同意提交个人资料</label><input name="password" type="password" aria-label="密码"><button type="submit">提交申请</button></form><script>window.events=[];window.submitted=false;document.addEventListener('change',e=>window.events.push(e.target.name));document.querySelector('form').onsubmit=e=>{e.preventDefault();window.submitted=true;};</script></html>
