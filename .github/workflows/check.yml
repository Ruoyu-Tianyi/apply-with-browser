name: Check Skill packages
on: [push, pull_request]
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package_skill.py --output-dir "$RUNNER_TEMP/skill-packages"
      - run: |
          python -m zipfile -t "$RUNNER_TEMP/skill-packages/apply-with-browser-standard.zip"
          python -m zipfile -t "$RUNNER_TEMP/skill-packages/apply-with-browser-workbuddy.zip"
